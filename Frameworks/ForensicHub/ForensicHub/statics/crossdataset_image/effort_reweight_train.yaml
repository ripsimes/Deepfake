# DDP
gpus: "0"
flag: train

# Log
log_dir: "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/effort_reweight_train"

# Task
if_predict_label: true
if_predict_mask: false

# Model
num_classes: 2
model:
  name: EffortTruforReweight
  init_config:
    yaml_config_path:        "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/DeepfakeBench/DeepfakeBench/training/config/config/detector/effort.yaml"
    trufor_config_path:      "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/IMDLBenCo/IMDLBenCo/statics/model_zoo/configs/trufor.yaml"
    np_pretrain_weights:     "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/trufor_pretrained/noiseprint.pth"
    mit_b2_pretrain_weights: "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/trufor_pretrained/mit_b2.pth"
    trufor_official_weights: "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/trufor_pretrained/weights/trufor.pth.tar"
    alpha: 1.0

# Datasets
train_dataset:
  name: AIGCLabelDataset
  dataset_name: DiffusionForensics_train
  init_config:
    image_size: 224
    path: /content/DiffusionForensics_Recons/train.json

test_dataset:
  - name: AIGCLabelDataset
    dataset_name: DiffusionForensics_val
    init_config:
      image_size: 224
      path: /content/DiffusionForensics_Recons/val.json

# Transform
transform:
  name: AIGCTransform
  init_config:
    norm_type: clip

# Evaluators
evaluator:
  - name: ImageF1
    init_config:
      threshold: 0.5
  - name: ImageAUC

# Training related
batch_size: 16
test_batch_size: 16
epochs: 20
accum_iter: 1
record_epoch: 0

# Test related
no_model_eval: false
test_period: 1

# Logging & TensorBoard
log_per_epoch_count: 20

# DDP & AMP settings
find_unused_parameters: true
use_amp: true

# Optimizer parameters
weight_decay: 0.05
lr: 0.0001
blr: 0.001
min_lr: 0.00001
warmup_epochs: 1

# Device and training control
device: "cuda"
seed: 42
resume: ""
start_epoch: 0
num_workers: 2
pin_mem: true

# Distributed training parameters
world_size: 1
local_rank: -1
dist_on_itp: false
dist_url: "env://"
