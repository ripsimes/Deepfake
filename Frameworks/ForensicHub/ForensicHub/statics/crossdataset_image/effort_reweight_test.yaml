# DDP
gpus: "0"
flag: test

# Log
log_dir: "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/effort_reweight_test"

# Point at the NEW training run's checkpoint folder
checkpoint_path: "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/effort_reweight_train"

# Task
if_predict_label: true
if_predict_mask: false

no_model_eval: false

# Model — must match the wrapper used at training time
num_classes: 2
model:
  name: EffortTruforReweight
  init_config:
    yaml_config_path:        "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/DeepfakeBench/DeepfakeBench/training/config/config/detector/effort.yaml"
    trufor_config_path:      "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/IMDLBenCo/IMDLBenCo/statics/model_zoo/configs/trufor.yaml"
    np_pretrain_weights:     "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/trufor_pretrained/noiseprint.pth"
    mit_b2_pretrain_weights: "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/trufor_pretrained/mit_b2.pth"
    trufor_official_weights: "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/trufor_pretrained/weights/trufor.pth.tar"
    alpha: 1.0

# Transform
transform:
  name: AIGCTransform
  init_config:
    norm_type: clip

# Test dataset
test_dataset:
  - name: AIGCLabelDataset
    dataset_name: DiffusionForensics_test
    init_config:
      image_size: 224
      path: /content/DiffusionForensics_Recons/test.json

# Evaluators
evaluator:
  - name: ImageF1
    init_config:
      threshold: 0.5
  - name: ImageAUC
  - name: ImageAP
  - name: ImageAccuracy

# Test related
test_batch_size: 16

# Device
device: "cuda"
num_workers: 2
pin_mem: true

# Distributed training parameters
world_size: 1
local_rank: -1
dist_on_itp: false
dist_url: "env://"
