# DDP
gpus: "0"
flag: train

# Log
log_dir: "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/resnet_train"

# Task
if_predict_label: true
if_predict_mask: false

# Model
model:
  name: Resnet50
  # Model specific setting
  init_config:
    output_type: label
    pretrained: true
    image_size: 224

# Train dataset
train_dataset:
  name: AIGCLabelDataset
  dataset_name: DiffusionForensics_train
  init_config:
    image_size: 224
    path: /content/DiffusionForensics_Recons/train.json
#  Test dataset (one or many)
test_dataset:
  - name: AIGCLabelDataset
    dataset_name: DiffusionForensics_val
    init_config:
      image_size: 224
      path: /content/DiffusionForensics_Recons/val.json
#   - name: AIGCLabelDataset
#     dataset_name: TrainEval
#     init_config:
#       image_size: 224
#       path: /content/DiffusionForensics_Recons/train.json
      
 

# Transform
transform:
  name: AIGCTransform

# Evaluators
evaluator:
  - name: ImageF1
    init_config:
      threshold: 0.5
  - name: ImageAUC

# Training related
batch_size: 32
test_batch_size: 16
epochs: 40
accum_iter: 1
record_epoch: 0  # Save the best only after record epoch.

# Test related
no_model_eval: false
test_period: 1

# Logging & TensorBoard
log_per_epoch_count: 20

# DDP & AMP settings
find_unused_parameters: false
use_amp: false

# Optimizer parameters
weight_decay: 0.05
lr: 1e-4
blr: 0.001
min_lr: 1e-5
warmup_epochs: 1

# Device and training control
device: "cuda"
seed: 42
resume: ""
start_epoch: 0
num_workers: 8
pin_mem: true

# Distributed training parameters
world_size: 1
local_rank: -1
dist_on_itp: false
dist_url: "env://"

