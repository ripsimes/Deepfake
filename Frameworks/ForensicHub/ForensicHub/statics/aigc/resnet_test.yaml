# DDP
gpus: "0"
flag: test

# Log
log_dir: "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/resnet_test"

# Task
if_predict_label: true
if_predict_mask: false
no_model_eval: false

# Model — must match training config exactly
model:
  name: Resnet50
  init_config:
    output_type: label
    pretrained: true
    image_size: 224

# Test dataset — publictest with reference labels
test_dataset:
  - name: AIGCLabelDataset
    dataset_name: PublicTest
    init_config:
      image_size: 224
      path: /content/DiffusionForensics_Recons/test.json

# Transform
transform:
  name: AIGCTransform

# Evaluators
evaluator:
  - name: ImageF1
    init_config:
      threshold: 0.5
  - name: ImageAUC

# Checkpoint — directory containing checkpoint-*.pth files from training
checkpoint_path: "/content/drive/MyDrive/Capstone_Hripsime/Frameworks/ForensicHub/log/resnet_train"

test_batch_size: 16

# Device
device: "cuda"
num_workers: 8
pin_mem: true

# Distributed training parameters
world_size: 1
local_rank: -1
dist_on_itp: false
dist_url: "env://"
